# Copy instances_template.json to instances.json and fill in your credentials
# before running: cp instances_template.json instances.json
#
# Run with:  docker compose up
# Stop with: docker compose down

services:
  trace-analyzer:
    build: .
    ports:
      - "${UI_PORT:-8080}:${UI_PORT:-8080}"
    environment:
      - UI_PORT=${UI_PORT:-8080}
    volumes:
      # instances.json is optional — app boots without it (empty instance list)
      - ./instances.json:/app/instances.json
      # Persist downloaded traces across restarts
      - ./data:/app/data
